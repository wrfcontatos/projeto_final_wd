<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - Wellington Resolve</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <div class="logo-container">
        <img src="img/Logo.jpeg" alt="Logo Wellington Resolve" class="logo" width="60">
        <div class="textos-logo">
          <div class="title">Wellington Resolve</div>
          <div class="subtitle">Soluções em Manutenção Residencial</div>
        </div>
      </div>

      <nav class="nav-group">
        <a href="index.html" class="nav-btn">Início</a>
        <a href="servicos.html" class="nav-btn nav-btn-active">Serviços</a>
        <a href="sobre.html" class="nav-btn">Sobre</a>
      </nav>
    </header>

    <main id="servicos-page">
      <h1 class="page-title">Nossos Serviços</h1>
      <p class="page-subtitle">Confira alguns dos trabalhos de manutenção residencial já realizados.</p>

      <div class="services-grid">

        <figure class="service-card">
          <img class="service-photo" src="img/sifao.jpeg" alt="Sifão instalado sob a pia">
          <figcaption>Troca de Sifão</figcaption>
        </figure>

        <figure class="service-card">
          <img class="service-photo" src="img/luminaria.webp" alt="Luminária pendente instalada no teto">
          <figcaption>Substituição de Luminárias</figcaption>
        </figure>

        <figure class="service-card">
          <img class="service-photo" src="img/interruptor.jpeg" alt="Interruptor touch instalado na parede">
          <figcaption>Substituição de Interruptores</figcaption>
        </figure>

        <figure class="service-card">
          <img class="service-photo" src="img/tomada.jpeg" alt="Tomadas duplas instaladas na parede">
          <figcaption>Substituição de Tomadas</figcaption>
        </figure>

        <figure class="service-card">
          <img class="service-photo" src="img/fechadura.jpeg" alt="Fechadura de porta instalada">
          <figcaption>Substituição de Fechaduras</figcaption>
        </figure>

        <figure class="service-card">
          <img class="service-photo" src="img/fechadura-eletronica.jpeg" alt="Fechadura eletrônica com teclado digital">
          <figcaption>Instalação de Fechaduras Eletrônicas</figcaption>
        </figure>

        <figure class="service-card">
          <img class="service-photo" src="img/prateleira.jpeg" alt="Prateleiras instaladas na parede">
          <figcaption>Instalação de Prateleiras</figcaption>
        </figure>

      </div>

      <div class="services-cta">
        <p>Precisa de algum desses serviços?</p>
        <a href="https://wa.me/5534999981175" class="cta cta-large">Peça seu orçamento</a>
      </div>
    </main>

    <footer id="contato">
      <p>Todos os direitos reservados - © Wellington Ferreira</p>
    </footer>

  </body>
</html>
